<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela Segura - Pago Móvil y USDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #080d19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md space-y-4">
        
        <!-- CONTENEDOR PRINCIPAL -->
        <div class="glass-card rounded-2xl p-6 shadow-2xl relative">
            
            <!-- HEADER -->
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-money-bill-transfer text-emerald-400"></i> Panel de Pagos
                    </h1>
                    <p class="text-xs text-slate-400">Comercios y Recarga Universal</p>
                </div>
                <button onclick="cerrarSesion()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition">
                    Cerrar Sesión
                </button>
            </div>

            <!-- ETIQUETA TIPO DE CUENTA -->
            <div id="badgeAccountType" class="mb-3 inline-block px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide uppercase bg-slate-800 text-slate-300 border border-slate-700">
                Cuenta Natural (Límite $1,000 USDT)
            </div>

            <!-- TARJETA DE SALDO DISPONIBLE -->
            <div class="bg-slate-900/90 border border-emerald-500/20 rounded-xl p-4 flex justify-between items-center mb-4">
                <div>
                    <p class="text-[11px] text-emerald-400 font-medium">Saldo Disponible</p>
                    <div class="text-2xl font-extrabold text-white tracking-tight">
                        USDT <span id="balanceUSDT">0.00</span>
                    </div>
                </div>
                <a href="/recarga" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-bolt text-xs"></i> Recargar con Hash
                </a>
            </div>

            <!-- BOTÓN AMARILLO: ACTUALIZAR A CUENTA COMERCIAL -->
            <button id="btnUpgradeComercial" onclick="solicitarCambioComercial()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-2.5 px-4 rounded-xl flex items-center justify-between mb-5 shadow-lg shadow-amber-500/10 transition cursor-pointer">
                <div class="text-left">
                    <div class="text-xs uppercase tracking-wide">Actualizar a Cuenta Comercial</div>
                    <div class="text-[10px] font-semibold opacity-90">($5.00 USDT / Transferencias Ilimitadas)</div>
                </div>
                <span class="bg-amber-400/80 text-slate-950 text-xs px-2.5 py-1 rounded-lg font-black uppercase">
                    Activar
                </span>
            </button>

            <!-- SECCIÓN: PAGAR A COMERCIO -->
            <div class="space-y-4 pt-2 border-t border-slate-800">
                <h2 class="text-xs font-bold text-slate-300">Pagar a Comercio</h2>

                <form id="formPago" onsubmit="procesarEnvioPago(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Teléfono o Alias del Comercio</label>
                        <div class="relative flex items-center">
                            <input type="text" id="telefonoDestino" placeholder="Ej: 0412 / 0416 / 0424..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <button type="button" class="absolute right-2 text-slate-400 hover:text-white bg-slate-900 border border-slate-800 px-2 py-1 rounded-lg text-xs flex items-center gap-1">
                                <i class="fa-solid fa-camera"></i> QR
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Monto a Enviar</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-slate-400 font-bold text-sm">$</span>
                            <input type="number" step="0.01" id="montoUSDT" placeholder="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-7 pr-12 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-bold">
                            <span class="absolute right-3 text-slate-500 font-bold text-xs">USDT</span>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm mt-2">
                        Enviar Pago al Instante (Nativo)
                    </button>
                </form>
            </div>

        </div>

    </div>

    <!-- SCRIPT JS -->
    <script>
        async function cargarSaldo() {
            const telefono = localStorage.getItem('userPhone') || localStorage.getItem('usuarioTelefono') || '';
            if (!telefono) return;

            try {
                const res = await fetch(`/api/saldo/${telefono}`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('balanceUSDT').innerText = parseFloat(data.saldoUSDT).toFixed(2);
                    
                    const badge = document.getElementById('badgeAccountType');
                    const btnUpgrade = document.getElementById('btnUpgradeComercial');

                    if (data.accountType === 'comercial' || data.accountType === 'emprendedor') {
                        badge.className = 'mb-3 inline-block px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide uppercase bg-amber-500/20 text-amber-300 border border-amber-500/30';
                        badge.innerText = 'Cuenta Comercial (Sin Límite)';
                        btnUpgrade.style.display = 'none';
                    } else {
                        badge.className = 'mb-3 inline-block px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide uppercase bg-slate-800 text-slate-300 border border-slate-700';
                        badge.innerText = 'Cuenta Natural (Límite $1,000 USDT)';
                        btnUpgrade.style.display = 'flex';
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function solicitarCambioComercial() {
            let telefono = localStorage.getItem('userPhone') || localStorage.getItem('usuarioTelefono');
            if (!telefono) {
                telefono = prompt("Ingresa tu número de teléfono registrado:");
            }
            if (!telefono) return;

            const pinSeguridad = prompt("🔒 Ingresa tu PIN de Seguridad (4 dígitos) para confirmar el pago de $5.00 USDT:");
            if (!pinSeguridad) return;

            try {
                const res = await fetch('/api/solicitar-comercial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telefono: telefono.trim(), 
                        pinSeguridad: pinSeguridad.trim(), 
                        planDeseado: 'comercial' 
                    })
                });

                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    cargarSaldo();
                }
            } catch (err) {
                alert("Error conectando con el servidor.");
            }
        }

        async function procesarEnvioPago(e) {
            e.preventDefault();
            const telefonoEmisor = localStorage.getItem('userPhone') || localStorage.getItem('usuarioTelefono');
            const telefonoComercio = document.getElementById('telefonoDestino').value.trim();
            const monto = document.getElementById('montoUSDT').value;

            if (!telefonoEmisor) {
                alert("No se detectó un teléfono registrado. Inicia sesión primero.");
                return;
            }

            const pinSeguridad = prompt("🔒 Ingresa tu PIN de Seguridad de 4 dígitos:");
            if (!pinSeguridad) return;

            try {
                const res = await fetch('/api/enviar-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        telefonoEmisor, 
                        telefonoComercio, 
                        montoUSDT: monto, 
                        pinSeguridad 
                    })
                });

                const data = await res.json();
                alert(data.message);

                if (!data.success && (data.message.includes('Límite superado') || data.message.includes('Naturales'))) {
                    if (confirm("¿Deseas activar la Cuenta Comercial ($5 USDT) para eliminar el límite diario de $1,000 USDT?")) {
                        solicitarCambioComercial();
                    }
                } else if (data.success) {
                    document.getElementById('formPago').reset();
                    cargarSaldo();
                }
            } catch (err) {
                alert("Error procesando el pago.");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/auth';
        }

        window.onload = cargarSaldo;
    </script>
</body>
</html>
