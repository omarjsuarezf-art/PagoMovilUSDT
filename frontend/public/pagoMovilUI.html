<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Pago Móvil USDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-xl shadow-lg space-y-6">
        <h2 class="text-xl font-bold text-green-400">Panel de Operaciones USDT</h2>
        
        <!-- Sección Enviar Pago -->
        <div class="border-b border-gray-700 pb-4">
            <h3 class="text-lg font-semibold mb-3">Enviar Pago Móvil</h3>
            <form id="pagoForm" class="space-y-3">
                <input type="text" id="telefonoEmisor" placeholder="Tu Teléfono" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <input type="text" id="telefonoComercio" placeholder="Teléfono Destino" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <input type="number" step="0.01" id="montoUSDT" placeholder="Monto USDT" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <input type="password" id="pinSeguridad" maxlength="4" placeholder="PIN de Seguridad" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 font-semibold py-2 rounded transition">Procesar Pago</button>
            </form>
            <div id="pagoResultado" class="mt-2 text-sm text-center"></div>
        </div>

        <!-- Sección Historial -->
        <div class="border-b border-gray-700 pb-4">
            <h3 class="text-lg font-semibold mb-3">Historial de Transacciones</h3>
            <input type="text" id="telHistorial" placeholder="Ingresa tu teléfono para buscar" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 mb-2">
            <button onclick="cargarHistorial()" class="w-full bg-gray-600 hover:bg-gray-500 py-2 rounded transition mb-3">Consultar Historial</button>
            <div id="listaHistorial" class="space-y-2 text-sm bg-gray-900 p-3 rounded max-h-40 overflow-y-auto"></div>
        </div>

        <!-- Sección Recarga Real (Blockchain / Exchange Universal) -->
        <div>
            <h3 class="text-lg font-semibold mb-3 text-green-400">Recargar Saldo (Exchange / Wallet)</h3>
            <form id="recargaForm" class="space-y-3">
                <input type="text" id="recargaTelefono" placeholder="Tu Teléfono de cuenta" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <input type="number" step="0.01" id="recargaMonto" placeholder="Monto exacto en USDT" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <input type="text" id="recargaHash" placeholder="Hash de la Transacción (txHash)" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                <select id="recargaMetodo" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600">
                    <option value="BinancePay">Binance Pay</option>
                    <option value="MetaMask_Phantom">MetaMask / Phantom (Blockchain)</option>
                    <option value="Otro_Exchange">Otro Exchange</option>
                </select>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 font-semibold py-2 rounded transition text-white">Validar y Acreditar Recarga</button>
            </form>
            <div id="recargaResultado" class="mt-2 text-sm text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById('pagoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bodyData = {
                telefonoEmisor: document.getElementById('telefonoEmisor').value,
                telefonoComercio: document.getElementById('telefonoComercio').value,
                montoUSDT: document.getElementById('montoUSDT').value,
                pinSeguridad: document.getElementById('pinSeguridad').value
            };
            const resDiv = document.getElementById('pagoResultado');
            
            try {
                const res = await fetch('/api/enviar-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                resDiv.textContent = data.message || data.error;
                resDiv.className = data.success ? 'mt-2 text-sm text-center text-green-400' : 'mt-2 text-sm text-center text-red-400';
            } catch (err) {
                resDiv.textContent = 'Error al procesar el pago.';
                resDiv.className = 'mt-2 text-sm text-center text-red-400';
            }
        });

        document.getElementById('recargaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bodyData = {
                phoneNumber: document.getElementById('recargaTelefono').value,
                amount: document.getElementById('recargaMonto').value,
                txHash: document.getElementById('recargaHash').value,
                metodo: document.getElementById('recargaMetodo').value
            };
            const resDiv = document.getElementById('recargaResultado');
            
            try {
                const res = await fetch('/api/recargar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                resDiv.textContent = data.message || data.error;
                resDiv.className = data.success ? 'mt-2 text-sm text-center text-green-400' : 'mt-2 text-sm text-center text-red-400';
            } catch (err) {
                resDiv.textContent = 'Error al acreditar la recarga.';
                resDiv.className = 'mt-2 text-sm text-center text-red-400';
            }
        });

        async function cargarHistorial() {
            const tel = document.getElementById('telHistorial').value;
            const contenedor = document.getElementById('listaHistorial');
            if (!tel) return;
            
            try {
                const res = await fetch(`/api/historial/${tel}`);
                const data = await res.json();
                if (data.success && data.transacciones.length > 0) {
                    contenedor.innerHTML = data.transacciones.map(t => `
                        <div class="border-b border-gray-800 pb-1 mb-1">
                            <span class="text-green-400">Ref: ${t.referencia}</span> | Monto: $${t.monto} | <span class="text-gray-400">${t.fechaHora || ''}</span>
                        </div>
                    `).join('');
                } else {
                    contenedor.innerHTML = '<p class="text-gray-400 text-center">No hay transacciones registradas.</p>';
                }
            } catch (e) {
                contenedor.innerHTML = '<p class="text-red-400 text-center">Error al cargar historial.</p>';
            }
        }
    </script>
</body>
</html>
