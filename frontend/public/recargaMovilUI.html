<!-- Pantalla de Recarga de USDT -->
<div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-800">📥 Recargar Saldo</h2>
        <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full">Red Polygon / USDT</span>
    </div>

    <!-- Instrucciones claras -->
    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
        <p class="text-xs text-slate-600 mb-2 font-medium">Escanea o copia la dirección de tu monedero para recibir fondos al instante:</p>

        </div>

        <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition duration-200">
            Verificar y Acreditar Saldo
        </button>
