<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Monedero USDT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="container py-5">
    <h1 class="text-center mb-5 fw-bold text-info">Panel de Control Contable</h1>
    
    <div class="row text-center g-4 justify-content-center">
        <!-- Saldo de Usuarios (Intocable) -->
        <div class="col-md-4">
            <div class="card p-4 border-danger border-top border-4">
                <h5 class="text-white fw-semibold mb-3">Saldo Usuarios</h5>
                <h3 id="txtSaldoUsuarios" class="text-danger fw-bold">$0.00</h3>
            </div>
        </div>
        <!-- Ganancias Binance -->
        <div class="col-md-4">
            <div class="card p-4 border-warning border-top border-4">
                <h5 class="text-white fw-semibold mb-3">Comisiones Binance</h5>
                <h3 id="txtBinance" class="text-warning fw-bold">$0.00</h3>
            </div>
        </div>
        <!-- Total Tuyo Libre -->
        <div class="col-md-4">
            <div class="card p-4 border-success border-top border-4">
                <h5 class="text-white fw-semibold mb-3">Total Tuyo Libre</h5>
                <h3 id="txtTotalTuyo" class="text-success fw-bold">$0.00</h3>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <button onclick="cargarMetricas()" class="btn btn-outline-info px-4 py-2">Actualizar Métricas</button>
    </div>

    <script>
        async function cargarMetricas() {
            try {
                const response = await fetch('/api/admin/balance');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('txtSaldoUsuarios').innerText = `$${data.saldoUsuarios} USDT`;
                    document.getElementById('txtBinance').innerText = `$${data.gananciaBinance} USDT`;
                    // El total libre refleja directamente las ganancias de Binance centralizadas
                    document.getElementById('txtTotalTuyo').innerText = `$${data.gananciaBinance} USDT`;
                }
            } catch (error) {
                console.error("Error al actualizar métricas:", error);
            }
        }
        cargarMetricas();
    </script>
</body>
</html>
