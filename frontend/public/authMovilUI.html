<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela Segura - Pago Móvil y USDT</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración del Manifiesto y Logotipo para Móviles/PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen text-slate-100 p-4">

    <!-- Contenedor principal estilo tarjeta móvil -->
    <div class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-6 border border-slate-800 flex flex-col justify-between">
        
        <!-- ================= VISTA 1: ACCESO Y REGISTRO ================= -->
        <div id="vistaAuth" class="space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-black text-sky-400 tracking-tight">🚀 Pasarela Segura</h1>
                <p class="text-xs text-slate-400 mt-1">Acceso instantáneo y titularidad estricta</p>
            </div>

            <!-- Sección de WhatsApp -->
            <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 space-y-3">
                <h2 class="text-sm font-semibold text-slate-200">Acceso por WhatsApp</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Número de Teléfono</label>
                    <input type="text" id="telefono" placeholder="Ej: 04123400436" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm text-white">
                </div>
                <button onclick="enviarCodigoWhatsApp()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl text-sm transition duration-200 shadow-md">
                    Enviar Código por WhatsApp
                </button>
            </div>

            <!-- Botón simulado para saltar al panel -->
            <button onclick="cambiarVista('vistaPanel')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg transition">
                ⚡ [Demo] Ir al Panel de Pagos Directo
            </button>

            <!-- Sección de Métodos (Cero Terceros) -->
            <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 space-y-3">
                <h2 class="text-sm font-semibold text-slate-200">Vincular Método (Cero Terceros)</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Cédula del Titular</label>
                    <input type="text" id="cedulaTitular" placeholder="V12345678" class="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Método Internacional</label>
                    <select id="metodoSelect" class="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm text-white">
                        <option value="binance">Binance Pay (Email o ID)</option>
                        <option value="zinli">Zinli (Correo)</option>
                        <option value="zelle">Zelle (Correo / Tel)</option>
                        <option value="paypal">PayPal (Correo)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Cuenta / Correo de Destino</label>
                    <input type="text" id="cuentaDestino" placeholder="tucuenta@correo.com" class="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none text-sm text-white">
                </div>
                <button onclick="registrarMetodoPago()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition duration-200 shadow-md">
                    Vincular de Forma Segura
                </button>
            </div>

            <div id="alertaRespuesta" class="text-center text-xs p-2 rounded-lg hidden"></div>
        </div>


        <!-- ================= VISTA 2: PANEL DE PAGOS Y COMERCIOS (USDT) ================= -->
        <div id="vistaPanel" class="hidden flex flex-col justify-between space-y-6">
            <div>
                <!-- Cabecera del Panel -->
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-lg font-bold text-slate-100">💸 Panel de Pagos</h1>
                        <p class="text-xs text-slate-400">Comercios y Pago Móvil</p>
                    </div>
                    <button onclick="cambiarVista('vistaAuth')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                        Cerrar Sesión
                    </button>
                </div>

                <!-- Saldo actual del usuario en USDT -->
                <div class="bg-gradient-to-r from-emerald-900/50 to-slate-900 border border-emerald-500/30 p-4 rounded-2xl mb-6 shadow-inner">
                    <p class="text-xs text-emerald-400 font-medium">Saldo Disponible</p>
                    <h2 class="text-3xl font-extrabold tracking-tight text-white mt-1">USDT 125.50</h2>
                </div>

                <!-- Formulario de Envío a Comercio -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Teléfono o Alias del Comercio</label>
                        <div class="flex gap-2">
                            <input type="tel" id="telefonoComercio" placeholder="0412-1234567" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-base text-white">
                            <!-- Botón para escanear QR -->
                            <button type="button" onclick="alert('Abriendo cámara para escanear QR del comercio...')" class="bg-slate-800 hover:bg-slate-700 px-4 rounded-xl text-slate-200 font-medium text-xs flex items-center justify-center border border-slate-700">
                                📷 QR
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Monto a Enviar</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 font-bold">$</span>
                            <input type="number" id="montoEnvio" step="0.01" placeholder="0.00" class="w-full pl-8 pr-16 py-3 bg-slate-950 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-xl font-bold text-white">
                            <span class="absolute inset-y-0 right-0 pr-4 flex items-center text-xs font-semibold text-slate-400">USDT</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón de acción final de pago conectado al backend -->
            <div class="mt-6 space-y-3">
                <button type="button" onclick="enviarPagoComercio()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 text-center text-sm">
                    Enviar Pago al Instante
                </button>
                <p class="text-center text-[10px] text-slate-500">Comisión de red integrada de forma transparente para la plataforma.</p>
            </div>
        </div>

    </div>

    <script>
        function cambiarVista(vistaId) {
            document.getElementById('vistaAuth').classList.add('hidden');
            document.getElementById('vistaPanel').classList.add('hidden');
            document.getElementById(vistaId).classList.remove('hidden');
        }

        async function enviarCodigoWhatsApp() {
            const telefono = document.getElementById('telefono').value;
            if (!telefono) {
                alert('Por favor ingresa un número de teléfono.');
                return;
            }

            try {
                const response = await fetch('/api/enviar-codigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefono })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                } else {
                    alert('Error al enviar el código.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un error de conexión con el servidor.');
            }
        }

        async function registrarMetodoPago() {
            const cedulaTitular = document.getElementById('cedulaTitular').value;
            const metodo = document.getElementById('metodoSelect').value;
            const cuentaDestino = document.getElementById('cuentaDestino').value;
            const alerta = document.getElementById('alertaRespuesta');

            if (!cedulaTitular || !cuentaDestino) {
                alerta.className = 'text-center text-xs p-2 rounded-lg bg-red-950 text-red-300 border border-red-800 block';
                alerta.innerText = 'Rellena todos los campos para continuar.';
                return;
            }

            try {
                const response = await fetch('/api/registrar-metodos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cedulaTitular, metodo, cuentaDestino })
                });
                const data = await response.json();

                alerta.className = data.success 
                    ? 'text-center text-xs p-2 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-800 block' 
                    : 'text-center text-xs p-2 rounded-lg bg-red-950 text-red-300 border border-red-800 block';
                alerta.innerText = data.message;
            } catch (error) {
                console.error('Error:', error);
                alerta.className = 'text-center text-xs p-2 rounded-lg bg-red-950 text-red-300 border border-red-800 block';
                alerta.innerText = 'Error de conexión al intentar vincular el método.';
            }
        }

        async function enviarPagoComercio() {
            const telefonoComercio = document.getElementById('telefonoComercio').value;
            const montoUSDT = document.getElementById('montoEnvio').value;

            if (!telefonoComercio || !montoUSDT) {
                alert('Por favor ingresa el teléfono/alias del comercio y el monto a enviar.');
                return;
            }

            try {
                const response = await fetch('/api/enviar-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefonoComercio, montoUSDT })
                });
                const data = await response.json();
                alert(data.message);

                if (data.success) {
                    document.getElementById('montoEnvio').value = '';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un error de conexión al intentar procesar el pago.');
            }
        }
    </script>
</body>
</html>
