<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso a Monedero</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex justify-center items-center h-screen">

    <!-- Pantalla de Login / Autenticación por Teléfono -->
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold text-slate-800 mb-2">📲 Ingresa a tu Monedero</h2>
        <p class="text-sm text-slate-500 mb-6">Usa tu número de teléfono para entrar al instante sin contraseñas.</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Número de Teléfono</label>
                <input type="tel" id="telefono" placeholder="+58 412 1234567" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-lg">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-md transition duration-200">
                Enviar Código por WhatsApp
            </button>
        </form>
    </div>

    <!-- Script para procesar el envío del código por WhatsApp -->
    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const telefono = document.getElementById('telefono').value;
            console.log("Enviando código al teléfono...", telefono);

            try {
                const response = await fetch('/api/enviar-codigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefono })
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert('¡Código enviado con éxito por WhatsApp!');
                } else {
                    alert('Error: ' + (data.message || 'No se pudo enviar el código'));
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Ocurrió un error al conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
